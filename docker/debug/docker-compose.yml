services:
  lingxi-debug:
    build:
      context: ../..
      dockerfile: docker/debug/Dockerfile
    image: lingxi-agent-debug:latest
    working_dir: /app
    environment:
      LINGXI_DEBUG_CONFIG: /sandbox/config.toml
      LINGXI_DEBUG_WORKSPACE: /sandbox/workspace
      LINGXI_DASHBOARD_HOST: 0.0.0.0
      LINGXI_DASHBOARD_PORT: "2236"
      LINGXI_HOST_GID: "${GID:-1000}"
      LINGXI_HOST_UID: "${UID:-1000}"
      LINGXI_DEBUG_PROFILE: "${LINGXI_DEBUG_PROFILE:-default}"
      HOME: /sandbox/home
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../..:/app
      - ./profiles/${LINGXI_DEBUG_PROFILE:-default}:/sandbox
    ports:
      - "2237:2236"
    stdin_open: true
    tty: true
